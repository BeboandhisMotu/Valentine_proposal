<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      padding: 40px 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      position: relative;
      z-index: 1;
    }

    h1 {
      margin-bottom: 30px;
      color: #e11d48;
      font-size: 2.2rem;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      position: relative;
    }

    button {
      padding: 12px 28px;
      font-size: 1.1rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }

    #yesBtn {
      background: #22c55e;
      color: white;
    }

    #noBtn {
      background: #ef4444;
      color: white;
      position: fixed;
      transition: left 0.25s ease, top 0.25s ease;
    }

    /* SECOND PAGE STYLES */
    .second-page {
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      background: linear-gradient(135deg, #fad0c4, #ff9a9e);
    }

    .second-page img {
      max-width: 300px;
      width: 80%;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      margin-bottom: 25px;
    }

    .message {
      font-size: 1.5rem;
      color: #be123c;
      line-height: 1.4;
    }

    .signature {
      margin-top: 10px;
      font-size: 1.3rem;
      color: #9f1239;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Will you be my Valentine? 💖</h1>
    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');

    // Get repository base path dynamically
    const basePath = location.pathname.replace(/\/[^\/]*$/, '/');

    function placeNoNextToYes() {
      const yesRect = yesBtn.getBoundingClientRect();
      noBtn.style.left = yesRect.right + 20 + 'px';
      noBtn.style.top = yesRect.top + 'px';
    }

    placeNoNextToYes();

    function moveNoButtonAnimated() {
      const padding = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    // MOVE AS SOON AS CURSOR GETS ON / NEAR THE BUTTON
    noBtn.addEventListener('mouseenter', moveNoButtonAnimated);
    noBtn.addEventListener('mousemove', moveNoButtonAnimated);
    noBtn.addEventListener('touchstart', moveNoButtonAnimated);

    yesBtn.addEventListener('click', () => {
      document.body.innerHTML = `
        <div class="second-page">
          <img src="${basePath}3rd.jpg" alt="Our Photo" />
          <div class="message">
            Love you from all 4 chambers of my heart and more ❤️
          </div>
          <div class="signature">
            Yours, Motu!
          </div>
        </div>
      `;
    });

    window.addEventListener('resize', placeNoNextToYes);
  </script>
</body>
</html>
